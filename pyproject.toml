[project]
name = "context-assembler-engine"
version = "0.1.0"
description = "Deterministic context assembly and dynamic token budgeting engine for LLM prompts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "tiktoken>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "connectors", "prompts"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".agents",
    ".groundwork",
    ".venv",
    ".tiktoken_cache",
    ".uv_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
